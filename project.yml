name: StyleLab
options:
  bundleIdPrefix: com.divyanshu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: BW5BHFVBG6
    CODE_SIGN_STYLE: Automatic
targets:
  StyleLab:
    type: application
    platform: iOS
    sources: [StyleLab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divyanshu.StyleLab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Style Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Style Lab saves design screenshots to your photo library so you can attach them to your handoff.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  StyleLabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StyleLabTests]
    dependencies:
      - target: StyleLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.divyanshu.StyleLabTests
schemes:
  StyleLab:
    build: {targets: {StyleLab: all}}
    test: {targets: [StyleLabTests]}
